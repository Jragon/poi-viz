name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V2
        uses: actions/checkout@v4
        with:
          path: v2

      - name: Checkout V1
        uses: actions/checkout@v4
        with:
          ref: v1
          path: v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node for V2
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install V2 dependencies
        working-directory: v2
        run: pnpm install --frozen-lockfile

      - name: Verify V2
        working-directory: v2
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build V2
        working-directory: v2
        run: pnpm build

      - name: Add V2 Pages fallback
        working-directory: v2
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Node for V1
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v1/package-lock.json

      - name: Install V1 dependencies
        working-directory: v1
        run: npm ci

      - name: Build V1
        working-directory: v1
        run: npm run build -- --base=/poi-viz/v1/

      - name: Copy V1 into Pages artifact
        run: |
          mkdir -p v2/dist/v1
          cp -R v1/dist/. v2/dist/v1/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
